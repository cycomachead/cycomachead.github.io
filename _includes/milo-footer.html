{%- comment -%}
  site.copy-start is the year the site went up; the end year tracks the build
  time so it can't go stale.
{%- endcomment -%}
{%- assign copy_end = site.time | date: '%Y' -%}
<footer class="site-footer bg-dark bottom mt-4">
  <div class="copy">
    &copy; {{ site.copy-start }}&ndash;{{ copy_end }} {{ site.author.name }}
    | <a href="{{ '/about/' | relative_url }}">About</a>
  </div>
</footer>
