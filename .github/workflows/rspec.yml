name: Run all page tests

# Run when a PR is opened, any branch is pushed.
# Also allow manually triggering workflows.
on:
  - push
  - workflow_dispatch

permissions:
  contents: read

jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          # The Ruby version is determined by the `.tool-versions` file in the root of the repo.
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install CSS/JS dependencies
        # The Sass build imports Bootstrap/Font Awesome from node_modules.
        run: npm ci
      - name: Run a11y tests
        run: bundle exec rspec
      - name: Summarize failures
        if: failure()
        run: ruby spec/support/spec_summary.rb
      - name: Keep screenshots from failed tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/capybara
          if-no-files-found: ignore
          retention-days: 7
